[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-research"
version = "0.1.0"
description = "Lead Ads merchant research agent: Telem search/fetch + form discovery + read-only browser"
requires-python = ">=3.11"
dependencies = [
  "telem-sdk>=0.4.0",
  "pydantic-ai-slim[anthropic]",
  "beautifulsoup4",
  "python-dotenv",
  "playwright",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
